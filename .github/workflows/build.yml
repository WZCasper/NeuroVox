name: Сборка Windows-версии

# Когда запускается:
#   * при создании тега вида v1.0.0  -> сборка, проверка и ПУБЛИКАЦИЯ релиза;
#   * вручную (вкладка Actions)      -> сборка и проверка, готовые файлы лежат в «Artifacts».
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы создать релиз и приложить к нему файлы
  issues: write     # нужно, чтобы при сбое самопроверки опубликовать отчёт в Issue (см. ниже)

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: NeuroVox для Windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Данные проверок (скачанные модели) лежат вне сборки и в неё не попадают.
      NEUROVOX_HOME: ${{ github.workspace }}\ci-data

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей (torch — только CPU) и PyInstaller
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          # torch и torchvision ставятся ОДНОЙ командой с CPU-индексом PyTorch как основным
          # источником (--index-url), а обычный PyPI подключён как дополнительный
          # (--extra-index-url) — для остальных пакетов из requirements.txt. Это важно:
          # если поставить torch/torchvision отдельной командой, а остальные зависимости
          # (easyocr тянет torchvision>=0.5) — второй командой без CPU-индекса, pip может
          # переустановить torchvision с обычного PyPI. У обычной и CPU-сборки одинаковый
          # номер версии, но разные бинарные расширения (ABI), и тогда получается ошибка
          # "operator torchvision::nms does not exist". Одна команда с общим списком
          # источников исключает эту рассинхронизацию.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt pyinstaller pyinstaller-hooks-contrib
          python -m pip list
          python -c "import torch, torchvision; print('torch', torch.__version__, '| torchvision', torchvision.__version__); from torchvision.ops import nms; print('torchvision::nms доступен')"

      - name: Модульные тесты
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -t . -v

      - name: Сборка программы (PyInstaller)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pyinstaller --noconfirm --clean NeuroVox.spec
          $size = (Get-ChildItem dist\NeuroVox -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "Размер папки dist\NeuroVox: {0:N0} МБ" -f $size

      - name: Быстрая проверка собранной программы
        timeout-minutes: 10
        shell: pwsh
        run: |
          . .\.github\scripts\Invoke-Selftest.ps1 -ReportName "selftest-fast" -ExtraArgs @() -TimeoutMs 480000

      - name: Проверка моделей (скачивание Silero и EasyOCR, синтез речи, распознавание)
        timeout-minutes: 40
        shell: pwsh
        run: |
          . .\.github\scripts\Invoke-Selftest.ps1 -ReportName "selftest-models" -ExtraArgs @("--models") -TimeoutMs 2100000

      - name: Упаковка в zip (портативная версия)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          7z a -tzip -mx=5 NeuroVox-windows-x64.zip .\dist\NeuroVox
          "Размер архива: {0:N0} МБ" -f ((Get-Item NeuroVox-windows-x64.zip).Length / 1MB)

      # Установщик — дополнительный удобный вариант. Если он не соберётся, релиз всё равно
      # будет создан с zip-архивом.
      - name: Создание установщика (Inno Setup)
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден после установки Inno Setup" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+(\.\d+)*$') { $version = "0.0.0" }
          & $iscc "/DAppVersion=$version" installer\NeuroVox.iss
          "Размер установщика: {0:N0} МБ" -f ((Get-Item dist-installer\NeuroVox-Setup.exe).Length / 1MB)

      - name: Сохранение отчётов проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports
          path: selftest-*.txt
          if-no-files-found: ignore

      # Логи и артефакты Actions отдаются с productionresultssa*.blob.core.windows.net,
      # который недоступен из некоторых сетевых окружений. Чтобы отчёт самопроверки
      # можно было прочитать и оттуда, при сбое он дополнительно публикуется в Issue —
      # обычный объект репозитория, читаемый через api.github.com.
      - name: Публикация отчёта в Issue при сбое
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $title = "Сборка не пройдена: $($env:GITHUB_REF_NAME) (запуск #$($env:GITHUB_RUN_NUMBER))"
          $body = New-Object System.Text.StringBuilder
          [void]$body.AppendLine("Автоматический отчёт о неудачной сборке.")
          [void]$body.AppendLine("")
          [void]$body.AppendLine("Коммит: $($env:GITHUB_SHA)")
          [void]$body.AppendLine("Запуск: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)")
          foreach ($name in @("selftest-fast", "selftest-models")) {
              $txt = "${name}.txt"
              $out = "${name}.stdout.log"
              $err = "${name}.stderr.log"
              if (Test-Path $txt) {
                  [void]$body.AppendLine("")
                  [void]$body.AppendLine("## Отчёт: $name")
                  [void]$body.AppendLine('```')
                  [void]$body.AppendLine((Get-Content $txt -Encoding UTF8 -Raw))
                  [void]$body.AppendLine('```')
              }
              foreach ($pair in @(@{Label = "stdout"; Path = $out}, @{Label = "stderr"; Path = $err})) {
                  if ((Test-Path $pair.Path) -and (Get-Item $pair.Path).Length -gt 0) {
                      [void]$body.AppendLine("")
                      [void]$body.AppendLine("## $name — $($pair.Label)")
                      [void]$body.AppendLine('```')
                      [void]$body.AppendLine((Get-Content $pair.Path -Encoding UTF8 -Raw))
                      [void]$body.AppendLine('```')
                  }
              }
          }
          $bodyText = $body.ToString()
          if ($bodyText.Length -gt 60000) {
              $bodyText = $bodyText.Substring(0, 60000) + "`n`n... (отчёт обрезан, полный текст — в артефакте selftest-reports)"
          }
          $bodyFile = New-TemporaryFile
          Set-Content -Path $bodyFile -Value $bodyText -Encoding UTF8
          gh issue create --title $title --body-file $bodyFile

      - name: Сохранение сборки (ручной запуск)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NeuroVox-windows-x64
          path: |
            NeuroVox-windows-x64.zip
            dist-installer/NeuroVox-Setup.exe
          compression-level: 0
          if-no-files-found: warn

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @("NeuroVox-windows-x64.zip")
          if (Test-Path "dist-installer\NeuroVox-Setup.exe") {
            $assets = @("dist-installer\NeuroVox-Setup.exe") + $assets
          }
          gh release create $env:GITHUB_REF_NAME @assets --title "NeuroVox $env:GITHUB_REF_NAME" --notes-file .github\release-notes.md
